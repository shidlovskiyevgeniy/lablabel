<!doctype html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="logo" href="index.html">
      <svg class="logo-mark" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="14" cy="14" r="10" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="14" cy="14" r="2.5" fill="var(--accent)"/>
        <path d="M14 0v3M14 25v3M0 14h3M25 14h3" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      lab<span>label</span>
    </a>
    <nav class="main">
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
      <a href="legal/contacts.html">Контакты</a>
    </nav>
    <div class="nav-right">
      <a href="cabinet.html">Кабинет</a>
      <a href="cart.html">Корзина<span class="cart-badge" data-cart-count style="display:none;"></span></a>
    </div>
  </div>
</header>

<main>
  <div class="wrap center-narrow">
    <h1>Вход в кабинет</h1>
    <p class="lead" style="font-size:14px;">Без пароля — вход по коду из письма на почту.</p>

    <div class="notice err" id="auth-error" style="display:none;"></div>

    <form id="auth-request-form" class="panel">
      <div class="field">
        <label for="req-email">E-mail</label>
        <input type="email" id="req-email" name="email" required />
      </div>
      <button type="submit" class="btn full">Получить код</button>
    </form>

    <form id="auth-verify-form" class="panel" style="display:none;">
      <p class="hint">Код отправлен на <strong id="verify-email-label"></strong>. Проверьте почту.</p>
      <div class="field">
        <label for="code">Код из письма</label>
        <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required />
      </div>
      <button type="submit" class="btn full">Войти</button>
    </form>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <div>
      <a href="legal/oferta.html">Публичная оферта</a>
      <a href="legal/vozvrat.html">Оплата и возврат</a>
      <a href="legal/contacts.html">Реквизиты и контакты</a>
    </div>
    <div>© lablabel, самозанятый (НПД)</div>
  </div>
</footer>

<script src="assets/js/cart.js"></script>

<script src="assets/js/auth.js"></script>
</body>
</html>
