<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расчёт стоимости визиток — LABLABEL</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101114">
<meta property="og:title" content="Расчёт стоимости визиток — LABLABEL">
<meta property="og:description" content="Коммерческое предложение от LABLABEL: состав заказа, цена и срок.">
<meta property="og:image" content="https://lablabel.ru/assets/img/og.png">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/styles.css">
<link rel="stylesheet" href="/assets/css/master.css?v=3">
</head>
<body class="mbody">

<main class="kp" id="kp">
  <p class="kp__err">Загружаем расчёт…</p>
</main>

<script src="/assets/js/app.js" defer></script>
<script defer>
/* КП для клиента: данные приходят в ?c= (deflate-raw + base64url), себестоимости в них нет. */
document.addEventListener('DOMContentLoaded', async () => {
  const root = document.getElementById('kp');
  const TITLES = { paper: 'Бумажные визитки', pvc: 'Пластиковые ПВХ-визитки', wood: 'Визитки из фанеры с гравировкой', nfc: 'NFC-визитки' };
  const TERMS = { paper: '1–2 дня', pvc: '1–3 дня', wood: '3–5 дней', nfc: '3–5 дней' };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => (n < 0 ? '−' : '') + rub(Math.abs(n)) + ' ₽';

  async function unpack(str) {
    const s = atob(str.slice(1).replace(/-/g, '+').replace(/_/g, '/'));
    const bytes = Uint8Array.from(s, c => c.charCodeAt(0));
    if (str[0] === 'j') return JSON.parse(new TextDecoder().decode(bytes));
    return JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
  }

  let d;
  try {
    d = await unpack(new URLSearchParams(location.search).get('c') || '');
    if (!TITLES[d.k] || !Array.isArray(d.rows)) throw new Error('bad');
  } catch (_) {
    root.innerHTML = '<div class="kp__err"><h1 class="kp__title">Расчёт не найден</h1><p class="small" style="margin:12px 0 22px">Ссылка неполная или устарела. Посчитать стоимость можно на сайте.</p><a class="btn" href="/#calc">Открыть калькулятор</a></div>';
    return;
  }

  const per = d.t / d.q;
  const perTxt = (per < 20 && per % 1 >= 0.05 ? per.toFixed(1) : String(Math.round(per))).replace('.', ',');
  const date = d.dt ? new Date(d.dt + 'T12:00:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
  document.title = `${TITLES[d.k]}, ${rub(d.q)} шт — ${rub(d.t)} ₽ · LABLABEL`;

  root.innerHTML = `
    <article class="kp__card">
      <header class="kp__top">
        <a class="logo" href="/" aria-label="LABLABEL — на сайт">
          <span class="logo__mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="logo__txt">LAB<b>LABEL</b></span>
        </a>
        <p class="kp__date">Коммерческое предложение${date ? '<br>от ' + date : ''}</p>
      </header>
      <div class="kp__body">
        <p class="kp__eyebrow">Расчёт стоимости</p>
        <h1 class="kp__title">${TITLES[d.k]}, ${rub(d.q)} шт</h1>
        <ul class="kp__rows">${d.rows.map(r => `<li><span>${esc(r[0])}</span><b>${fmt(r[1])}</b></li>`).join('')}</ul>
        <p class="kp__sum"><span>Итого к оплате</span><b>${rub(d.t)} ₽</b></p>
        <div class="kp__meta">
          <div><span>За штуку</span><b>${perTxt} ₽</b></div>
          <div><span>Срок изготовления</span><b>${d.u ? '1 рабочий день' : TERMS[d.k]}</b></div>
        </div>
        ${d.n ? `<p class="kp__note">${esc(d.n)}</p>` : ''}
        ${d.m ? `<p class="kp__from">Расчёт подготовил: <b>${esc(d.m)}</b></p>` : ''}
        <div class="kp__act">
          <a class="btn" href="/#order">Оформить заказ</a>
          <a class="btn btn--ghost" href="https://t.me/lablabel" target="_blank" rel="noopener">Написать в Telegram</a>
          <button class="btn btn--ghost" type="button" onclick="window.print()">Сохранить PDF</button>
        </div>
        <p class="kp__foot">Оплата по СБП или на карту, после оплаты — чек самозанятого из «Мой налог». Самовывоз в Солнечногорске бесплатно, доставка СДЭК или Почтой России по тарифу перевозчика. Расчёт не является публичной офертой.</p>
      </div>
    </article>`;

  // контакты из CONFIG (app.js)
  root.querySelectorAll('a[href^="https://t.me/"]').forEach(a => { a.href = CONFIG.telegram; });
});
</script>
</body>
</html>
